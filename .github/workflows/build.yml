name: Build Local RAG Application

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install llama-cpp-python (pre-built wheel)
        run: |
          python -m pip install --upgrade pip
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create models directory
        run: New-Item -ItemType Directory -Force -Path models
        shell: pwsh

      - name: Download Qwen2.5 0.5B model
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf" -OutFile "models/qwen2.5-0.5b-instruct-q4_k_m.gguf"
        shell: pwsh

      - name: Setup embedding model
        run: |
          python -c "from sentence_transformers import SentenceTransformer; model = SentenceTransformer('BAAI/bge-small-en-v1.5'); model.save('models/embedding_model')"

      - name: Verify model files
        run: |
          Write-Host "Checking model files..."
          if (Test-Path "models/qwen2.5-0.5b-instruct-q4_k_m.gguf") { Write-Host "[OK] Model file exists" } else { Write-Host "[FAIL] Model file missing"; exit 1 }
          if (Test-Path "models/embedding_model") { Write-Host "[OK] Embedding model exists" } else { Write-Host "[FAIL] Embedding model missing"; exit 1 }
        shell: pwsh

      - name: Test llama_cpp installation
        run: |
          python -c "import llama_cpp; print('[OK] llama_cpp imported successfully')"
          python -c "from llama_cpp import Llama; print('[OK] Llama class accessible')"

      - name: Build with PyInstaller (STANDALONE ONE-FILE)
        run: |
          pyinstaller --clean --noconfirm LocalRAG.spec

      - name: Verify build output
        run: |
          Write-Host "Checking build output..."
          if (Test-Path "dist/LocalRAG.exe") {
            $size = (Get-Item "dist/LocalRAG.exe").Length / 1MB
            Write-Host "[OK] Build successful! Size: $([math]::Round($size, 2)) MB"
            Write-Host "This is a STANDALONE .exe - no other files needed!"
          } else {
            Write-Host "[FAIL] Build failed - exe not found"
            Get-ChildItem -Path dist -Recurse | Write-Host
            exit 1
          }
        shell: pwsh

      - name: Create distribution zip
        run: |
          Compress-Archive -Path dist/LocalRAG.exe -DestinationPath LocalRAG-Standalone.exe.zip
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalRAG-Windows-Standalone
          path: LocalRAG-Standalone.exe.zip
          retention-days: 30

  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/LocalRAG-Windows-Standalone/LocalRAG-Standalone.exe.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
