name: Build Local RAG Application

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller requests

      - name: Setup embedding model (for RAG)
        run: |
          python -c "from sentence_transformers import SentenceTransformer; model = SentenceTransformer('BAAI/bge-small-en-v1.5'); model.save('models/embedding_model')"

      - name: Verify embedding model
        run: |
          Write-Host "Checking embedding model..."
          if (Test-Path "models/embedding_model") { Write-Host "[OK] Embedding model exists" } else { Write-Host "[FAIL] Embedding model missing"; exit 1 }
        shell: pwsh

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm LocalRAG.spec

      - name: Verify build output
        run: |
          Write-Host "Checking build output..."
          if (Test-Path "dist/LocalRAG.exe") {
            $size = (Get-Item "dist/LocalRAG.exe").Length / 1MB
            Write-Host "[OK] Build successful! Size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Host "[FAIL] Build failed - exe not found"
            Get-ChildItem -Path dist -Recurse | Write-Host
            exit 1
          }
        shell: pwsh

      - name: Create distribution zip
        run: |
          Compress-Archive -Path dist/LocalRAG.exe -DestinationPath LocalRAG-Windows.zip
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalRAG-Windows
          path: LocalRAG-Windows.zip
          retention-days: 30

  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/LocalRAG-Windows/LocalRAG-Windows.zip
          generate_release_notes: true
          body: |
            ## LocalRAG - llama.cpp Version

            This version uses llama.cpp for local LLM inference.

            ### Requirements
            - Download a GGUF model file and place it in the `models/` folder
            - Recommended: Qwen 2.5 0.5B Instruct (q4_k_m quantization)

            ### Model Download
            Find models at: https://huggingface.co/models?search=gguf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
