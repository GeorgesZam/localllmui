[project]
name = "localllmui"
version = "0.1.0"
description = "Local LLM UI with RAG support"
requires-python = ">=3.9"
dependencies = [
    "llama-cpp-python>=0.3.16",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "PyPDF2>=3.0.0",
    "python-docx>=0.8.11",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.21",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
    "Pillow>=10.0.0",
    "customtkinter>=5.2.0",
    "langchain>=0.1.0",
    "pandas>=2.0.0",
    "reportlab>=4.0.0",
    "matplotlib>=3.7.0",
    "psutil>=5.9.0",
]

[tool.uv]
dev-dependencies = [
    "llama-cpp-python",
]
